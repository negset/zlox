<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Textarea Prism.js Highlight</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
      rel="stylesheet"
    />

    <style>
      /* 入力エリア全体のコンテナ */
      .editor-container {
        position: relative;
        width: 100%;
        height: 300px;
        font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
        font-size: 16px;
        line-height: 1.5;
      }

      /* textarea と pre/code の共通スタイル（完全に一致させる） */
      .editor-container textarea,
      .editor-container pre {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-y: auto;
      }

      /* 1. 重なり順：textareaを上にする */
      .editor-container textarea {
        z-index: 2;
        background: transparent; /* 背景を透明にして下のハイライトを透かす */
        color: transparent; /* 文字も透明にする（文字の重複・ズレを防ぐ） */
        caret-color: #000; /* カーソル（キャレット）だけは見せる */
        resize: none;
      }

      /* 2. 重なり順：pre（ハイライト側）を下にする */
      .editor-container pre {
        z-index: 1;
        background: #f5f2f0; /* Prismのデフォルト背景色に合わせる */
        pointer-events: none; /* 下にあるpreへのクリック判定を無効化 */
      }

      /* Prism.jsが当てるcodeタグの不要な余白などをリセット */
      .editor-container code {
        font-family: inherit !important;
        font-size: inherit !important;
      }
    </style>
  </head>
  <body>
    <h3>JavaScript コードエディタ（自由入力）</h3>

    <div class="editor-container">
      <textarea
        id="editing"
        spellcheck="false"
        placeholder="ここにコードを入力してください..."
      ></textarea>
      <pre
        id="highlighting"
        aria-hidden="true"
      ><code class="language-javascript" id="highlighting-content"></code></pre>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
      const textarea = document.getElementById("editing");
      const codeArea = document.getElementById("highlighting-content");
      const preArea = document.getElementById("highlighting");

      function updateCode() {
        let text = textarea.value;

        // 最後の文字が改行だった場合、表示側の高さがズレるのを防ぐための処理
        if (text[text.length - 1] === "\n") {
          text += " ";
        }

        // HTML特殊文字をエスケープした上で、code要素にテキストを挿入
        codeArea.textContent = text;

        // Prism.js を強制的に再適用してハイライトする
        Prism.highlightElement(codeArea);
      }

      // 入力されるたびに同期してハイライトを更新
      textarea.addEventListener("input", updateCode);

      // スクロール位置を完全に同期させる
      textarea.addEventListener("scroll", () => {
        preArea.scrollTop = textarea.scrollTop;
        preArea.scrollLeft = textarea.scrollLeft;
      });

      // 初期実行
      updateCode();
    </script>
  </body>
</html>
